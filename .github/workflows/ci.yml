name: Windows verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  tooling:
    name: Python tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify portable tooling and owned-process cleanup
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run portable search and CSV regressions
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/portable
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/search_query.cpp -o artifacts/portable/search-query-tests
          artifacts/portable/search-query-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/csv.cpp -o artifacts/portable/csv-tests
          artifacts/portable/csv-tests
      - name: Verify release and performance workflow guards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
  verify:
    needs: tooling
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify published application
        run: python tools/taskmgr.py build --test-configuration Release
      - name: Benchmark components and exercise native UI headlessly
        run: python tools/taskmgr.py benchmark --seconds 5
      - name: Prepare verified release package
        run: |
          python tools/taskmgr.py package
          python .github/scripts/release.py --artifact-dir artifacts/app
      - name: Upload standalone native executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-task-manager
          path: artifacts/app/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verification-reports
          path: |
            artifacts/native-tests/*.json
            artifacts/benchmark-suite/
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: task-manager-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the verified production build
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name native-task-manager --dir artifacts/app
      - name: Publish the verified version
        run: python .github/scripts/release.py --artifact-dir artifacts/app --publish
